<script>
// С телефона и планшета уводим на сенсорную версию. Проверяем не марку
// устройства, а тип ввода: pointer:coarse — палец, а не мышь. Ноутбук с
// сенсорным экраном остаётся на ПК-версии, потому что там основной указатель
// всё равно мышь.
//
// Три условия обязательны, иначе получится рекурсия: m.html грузит эту же
// страницу в iframe как ?touch=1, и без проверок она увела бы iframe снова на
// m.html, и так до бесконечности. Плюс ?pc — аварийный выход на ПК-версию с
// любого устройства.
if (window.top === window.self
    && !/[?&](touch=1|pc)(&|$)/.test(location.search)
    && window.matchMedia
    && window.matchMedia("(pointer: coarse)").matches) {
  location.replace("m.html");
}
</script>

"use strict";

const WW = 1260, WH = 600;

// Мобильная обёртка m.html грузит игру как index.html?touch=1 и рисует поверх

// Логика, физика и управление общие. На ПК параметра нет — флаг всегда false,

// целиком: картинка заполняет экран, и всё поле боя видно сразу.
// Следствие: WW - VW == 0, значит камера никуда не едет и все clamp'ы по
// камере честно схлопываются в ноль — отдельного кода для этого не нужно.

const ACCESSORY_COLORS = ["#3a6fd8", "#d8903a", "#232a30", "#ff5fb0"];
const ACCESSORY_NAMES = ["в кепке", "в бандане", "в очках", "с ирокезом"];

const DECO_TYPES_INFO = {
  rock: { color: "#8c8c86", kind: "dome", footprint: 20, peak: 30 },
  bush: { color: "#2f8f4a", kind: "dome", footprint: 17, peak: 20 },
  cactus: { color: "#256b38", kind: "cactus", footprint: 19, peak: 62 },
};
const DECO_COUNT_MIN = 6;
const DECO_COUNT_MAX = 9;
const DECO_MARGIN = 40;

function decoBumpAt(info, dx) {
  const adx = Math.abs(dx);
  if (info.kind === "dome") {
    if (adx > info.footprint) return 0;
    return info.peak * Math.sqrt(Math.max(0, 1 - (adx * adx) / (info.footprint * info.footprint)));
  }
  if (info.kind === "cactus") {
    if (adx <= 7) return info.peak;
    if (adx <= 9) return info.peak * 0.75;
    if (adx <= info.footprint) return info.peak * 0.48;
    return 0;
  }
  return 0;
}

function placeAndStampDecorations(h, decoColor, decoBaseY) {
  const types = Object.keys(DECO_TYPES_INFO);
  const count = DECO_COUNT_MIN + Math.floor(Math.random() * (DECO_COUNT_MAX - DECO_COUNT_MIN + 1));
  const placed = [];
  let attempts = 0;
  while (placed.length < count && attempts < 400) {
    attempts++;
    const type = types[Math.floor(Math.random() * types.length)];
    const info = DECO_TYPES_INFO[type];
    const cx = Math.round(DECO_MARGIN + Math.random() * (WW - DECO_MARGIN * 2));
    const lo = cx - info.footprint, hi = cx + info.footprint;
    if (lo < 0 || hi >= WW) continue;
    let ok = true;
    for (let x = lo; x <= hi; x++) { if (h[x] >= WATER_BASE_LEVEL - 2) { ok = false; break; } }
    if (!ok) continue;
    if (placed.some(p => Math.abs(p.cx - cx) < p.footprint + info.footprint + 20)) continue;
    placed.push({ cx, footprint: info.footprint });
    for (let x = lo; x <= hi; x++) {
      const bump = decoBumpAt(info, x - cx);
      if (bump <= 0) continue;
      decoBaseY[x] = h[x];
      h[x] = Math.max(0, h[x] - bump);
      decoColor[x] = info.color;
    }
  }
}

function isDecoratedAt(x) {
  const col = clamp(Math.round(x), 0, WW - 1);
  return !!terrain.decoColor[col];
}

const canvas = document.getElementById("game");
// Ширину канваса и рамки экрана подгоняем до getContext: присвоение canvas.width
// сбрасывает состояние контекста, включая imageSmoothingEnabled.
if (TOUCH_UI) {
  canvas.width = VW;
  const wrap = document.querySelector(".screen-wrap");
  if (wrap) wrap.style.width = VW + "px";
}
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const terrainCanvas = document.createElement("canvas");
terrainCanvas.width = WW;
terrainCanvas.height = WH;
const tctx = terrainCanvas.getContext("2d");

// ===== AUDIO (procedural 8-bit, no external files) =====

let audioCtx = null;
let masterGain = null;
let musicGain = null;
let noiseBuffer = null;

function ensureAudio() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") audioCtx.resume();
    return;
  }
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  audioCtx = new Ctor();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = state.muted ? 0 : 0.5;
  masterGain.connect(audioCtx.destination);
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.5;
  musicGain.connect(masterGain);
}

function setMuted(muted) {
  state.muted = muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
}

function toggleMute() {
  ensureAudio();
  setMuted(!state.muted);
  playUiBlip();
}

function getNoiseBuffer() {
  if (noiseBuffer) return noiseBuffer;
  const len = Math.floor(audioCtx.sampleRate * 1.0);
  noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return noiseBuffer;
}

function playBlip(opts) {
  if (!audioCtx || state.muted) return;
  const freq = opts.freq || 440;
  const duration = opts.duration || 0.12;
  const type = opts.type || "square";
  const volume = opts.volume || 0.25;
  const freqEnd = opts.freqEnd;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(freq, 1), t0);
  if (freqEnd !== undefined) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + duration);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(volume, t0 + Math.min(0.01, duration * 0.2));
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(masterGain);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playNoiseBurst(opts) {
  if (!audioCtx || state.muted) return;
  const duration = opts.duration || 0.4;
  const volume = opts.volume || 0.4;
  const startFreq = opts.startFreq || 1800;
  const endFreq = opts.endFreq || 80;
  const t0 = audioCtx.currentTime;
  const src = audioCtx.createBufferSource();
  src.buffer = getNoiseBuffer();
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(startFreq, t0);
  filter.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 20), t0 + duration);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  src.connect(filter).connect(gain).connect(masterGain);
  src.start(t0);
  src.stop(t0 + duration + 0.02);
}

function playShootSound(type) {
  ensureAudio();
  if (type === "bazooka") {
    playBlip({ freq: 180, freqEnd: 70, duration: 0.16, type: "square", volume: 0.28 });
  } else {
    playBlip({ freq: 320, freqEnd: 200, duration: 0.12, type: "triangle", volume: 0.22 });
  }
}

function playExplosionSound(radius) {
  ensureAudio();
  const size = clamp(radius / 40, 0.5, 1.8);
  playNoiseBurst({ duration: 0.45 * size, volume: 0.45, startFreq: 2200 * size, endFreq: 60 });
  playBlip({ freq: 95, freqEnd: 35, duration: 0.32 * size, type: "sine", volume: 0.4 });
}

function playHitVoiceSound() {
  ensureAudio();
  if (!audioCtx || state.muted) return;
  const t0 = audioCtx.currentTime;
  const variant = Math.floor(Math.random() * 3);
  const osc = audioCtx.createOscillator();
  osc.type = "square";
  const filter = audioCtx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 900;
  filter.Q.value = 4;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.45, t0 + 0.01);
  let stopAt;
  if (variant === 0) {
    const base = 260 + Math.random() * 60;
    osc.frequency.setValueAtTime(base, t0);
    osc.frequency.linearRampToValueAtTime(base * 1.8, t0 + 0.05);
    osc.frequency.linearRampToValueAtTime(base * 1.1, t0 + 0.09);
    osc.frequency.linearRampToValueAtTime(base * 1.6, t0 + 0.13);
    osc.frequency.linearRampToValueAtTime(base * 0.6, t0 + 0.22);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
    stopAt = 0.26;
  } else if (variant === 1) {
    const base = 480 + Math.random() * 80;
    osc.frequency.setValueAtTime(base, t0);
    osc.frequency.exponentialRampToValueAtTime(base * 0.35, t0 + 0.16);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    stopAt = 0.2;
  } else {
    const base = 340 + Math.random() * 60;
    osc.frequency.setValueAtTime(base, t0);
    osc.frequency.setValueAtTime(base * 1.5, t0 + 0.05);
    osc.frequency.setValueAtTime(base * 0.8, t0 + 0.09);
    osc.frequency.setValueAtTime(base * 1.3, t0 + 0.13);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.17);
    stopAt = 0.19;
  }
  osc.connect(filter).connect(gain).connect(masterGain);
  osc.start(t0);
  osc.stop(t0 + stopAt);
}

function updateMusic(dt) {
  if (!audioCtx || state.muted || state.screen === "GAME_OVER") return;
  musicTimer += dt;

  musicTimer -= MUSIC_STEP_TIME;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = "square";
  osc.frequency.setValueAtTime(MUSIC_NOTES[musicIndex % MUSIC_NOTES.length], t0);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.14, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
  osc.connect(gain).connect(musicGain);
  osc.start(t0);
  osc.stop(t0 + 0.22);
  musicIndex++;
}

const ISLAND_GAP_MARGIN = 180;
const ISLAND_CORE_MIN_WIDTH = 40;
const ISLAND_CORE_MAX_WIDTH = 90;
const ISLAND_TAPER_MIN = 25;
const ISLAND_TAPER_MAX = 75;

function planIslandGaps() {
  const roll = Math.random();
  const numGaps = roll < 0.2 ? 0 : (roll < 0.7 ? 1 : 2);
  const gaps = [];
  let attempts = 0;
  while (gaps.length < numGaps && attempts < 50) {
    attempts++;
    const coreWidth = ISLAND_CORE_MIN_WIDTH + Math.random() * (ISLAND_CORE_MAX_WIDTH - ISLAND_CORE_MIN_WIDTH);
    const taperLeft = ISLAND_TAPER_MIN + Math.random() * (ISLAND_TAPER_MAX - ISLAND_TAPER_MIN);
    const taperRight = ISLAND_TAPER_MIN + Math.random() * (ISLAND_TAPER_MAX - ISLAND_TAPER_MIN);
    const cx = ISLAND_GAP_MARGIN + Math.random() * (WW - ISLAND_GAP_MARGIN * 2);
    const x0 = Math.round(cx - coreWidth / 2), x1 = Math.round(cx + coreWidth / 2);
    const footprintLo = x0 - taperLeft, footprintHi = x1 + taperRight;
    const overlaps = gaps.some(g => footprintLo < g.footprintHi + 60 && footprintHi > g.footprintLo - 60);
    if (overlaps) continue;
    gaps.push({ x0, x1, taperLeft, taperRight, footprintLo, footprintHi });
  }
  return gaps;
}

function applyIslandDepression(rough, gaps) {
  const targetDepth = WATER_BASE_LEVEL + 60;
  for (const g of gaps) {
    const lo = Math.max(0, Math.floor(g.x0 - g.taperLeft));
    const hi = Math.min(WW - 1, Math.ceil(g.x1 + g.taperRight));
    for (let x = lo; x <= hi; x++) {
      let t;
      if (x >= g.x0 && x <= g.x1) t = 1;
      else if (x < g.x0) t = 1 - clamp((g.x0 - x) / g.taperLeft, 0, 1);
      else t = 1 - clamp((x - g.x1) / g.taperRight, 0, 1);
      const eased = t * t * (3 - 2 * t);
      rough[x] = rough[x] + (targetDepth - rough[x]) * eased;
    }
  }
}

function generateTerrain() {
  const mask = new Uint8Array(WW * WH);
  const baseline = 380 + (Math.random() * 40 - 20);
  const freq1 = 0.006 + Math.random() * 0.004, amp1 = 35 + Math.random() * 15;
  const freq2 = 0.02 + Math.random() * 0.01, phase2 = Math.random() * Math.PI * 2, amp2 = 15 + Math.random() * 10;
  const rough = new Float32Array(WW);
  for (let x = 0; x < WW; x++) {
    rough[x] = baseline + Math.sin(x * freq1) * amp1 + Math.sin(x * freq2 + phase2) * amp2;
  }
  applyIslandDepression(rough, planIslandGaps());
  const STEP = 3, MAXDELTA = 7;
  let prev = null;
  const h = new Float32Array(WW);
  for (let x = 0; x < WW; x++) {
    let v = Math.round(rough[x] / STEP) * STEP;
    if (prev !== null) {
      if (v - prev > MAXDELTA) v = prev + MAXDELTA;
      if (prev - v > MAXDELTA) v = prev - MAXDELTA;
    }
    h[x] = v;
    prev = v;
  }
  const decoColor = new Array(WW).fill(null);
  const decoBaseY = new Array(WW).fill(0);
  placeAndStampDecorations(h, decoColor, decoBaseY);
  for (let x = 0; x < WW; x++) {
    if (h[x] >= WATER_BASE_LEVEL - 2) continue;
    const top = clamp(Math.round(h[x]), 0, WATER_BASE_LEVEL - 1);
    for (let y = top; y < WATER_BASE_LEVEL; y++) mask[y * WW + x] = 1;
  }
  return { mask, heights: new Float32Array(WW), decoColor, decoBaseY };
}

function hasGroundAt(x) {
  const col = clamp(Math.round(x), 0, WW - 1);
  return terrain.heights[col] < WATER_BASE_LEVEL;
}

function drawDirtBand(x, y0, y1) {
  const mid = 430;
  if (y1 <= mid) {
    tctx.fillStyle = COLORS.dirt1;
    tctx.fillRect(x, y0, 1, y1 - y0);
  } else if (y0 >= mid) {
    tctx.fillStyle = COLORS.dirt2;
    tctx.fillRect(x, y0, 1, y1 - y0);
  } else {
    tctx.fillStyle = COLORS.dirt1;
    tctx.fillRect(x, y0, 1, mid - y0);
    tctx.fillStyle = COLORS.dirt2;
    tctx.fillRect(x, mid, 1, y1 - mid);
  }
}

function drawColumnRun(x, y0, y1, isTopRun) {
  if (isTopRun) {
    const decoColor = terrain.decoColor[x];
    const decoBase = terrain.decoBaseY[x];
    if (decoColor && decoBase > y0) {
      const decoEnd = Math.min(decoBase, y1);
      tctx.fillStyle = decoColor;
      tctx.fillRect(x, y0, 1, decoEnd - y0);
      if (decoEnd < y1) drawColumnRun(x, decoEnd, y1, true);
      return;
    }
    const capH = Math.min(3, y1 - y0);
    tctx.fillStyle = COLORS.grass;
    tctx.fillRect(x, y0, 1, capH);
    if (y0 + capH < y1) drawDirtBand(x, y0 + capH, y1);
  } else {
    drawDirtBand(x, y0, y1);
  }
}

function redrawTerrainColumns(xStart, xEnd) {
  xStart = Math.max(0, xStart);
  xEnd = Math.min(WW - 1, xEnd);
  const w = xEnd - xStart + 1;
  if (w <= 0) return;
  tctx.clearRect(xStart, 0, w, WH);
  for (let x = xStart; x <= xEnd; x++) {
    let y = 0;
    let firstSolidY = -1;
    while (y < WH) {
      if (terrain.mask[y * WW + x]) {
        if (firstSolidY === -1) firstSolidY = y;
        const runStart = y;
        while (y < WH && terrain.mask[y * WW + x]) y++;
        drawColumnRun(x, runStart, y, runStart === firstSolidY);
      } else {
        y++;
      }
    }
    terrain.heights[x] = firstSolidY === -1 ? WH : firstSolidY;
  }
}

function digCrater(cx, cy, radius) {
  const GRID = 3;
  const spots = [{ x: cx, y: cy, r: radius }];
  for (let i = 0; i < 5; i++) {
    const ang = Math.random() * Math.PI * 2;
    const rr = radius * (0.55 + Math.random() * 0.35);
    spots.push({ x: cx + Math.cos(ang) * radius * 0.75, y: cy + Math.sin(ang) * radius * 0.75, r: rr });
  }
  let minX = WW, maxX = 0, minY = WH, maxY = 0;
  for (const s of spots) {
    minX = Math.min(minX, s.x - s.r); maxX = Math.max(maxX, s.x + s.r);
    minY = Math.min(minY, s.y - s.r); maxY = Math.max(maxY, s.y + s.r);
  }
  const x0 = Math.max(0, Math.floor(minX / GRID) * GRID);
  const x1 = Math.min(WW - 1, Math.ceil(maxX / GRID) * GRID);
  const y0 = Math.max(0, Math.floor(minY / GRID) * GRID);
  const y1 = Math.min(WH - 1, Math.ceil(maxY / GRID) * GRID);
  for (let by = y0; by <= y1; by += GRID) {
    for (let bx = x0; bx <= x1; bx += GRID) {
      const px = bx + GRID / 2, py = by + GRID / 2;
      let inside = false;
      for (const s of spots) {
        const dx = px - s.x, dy = py - s.y;
        if (dx * dx + dy * dy <= s.r * s.r) { inside = true; break; }
      }
      if (inside) {
        for (let yy = by; yy < by + GRID && yy < WH; yy++) {
          const row = yy * WW;
          for (let xx = bx; xx < bx + GRID && xx < WW; xx++) terrain.mask[row + xx] = 0;
        }
      }
    }
  }
  for (let x = x0; x <= x1; x++) terrain.decoColor[x] = null;
  redrawTerrainColumns(x0, x1);
}

function drawSprite(pattern, x, y, scale, colorMap, flipX) {
  const rows = pattern.length, cols = pattern[0].length;
  for (let r = 0; r < rows; r++) {
    const row = pattern[r];
    for (let c = 0; c < cols; c++) {
      const ch = row[c];
      if (ch === ".") continue;
      const col = colorMap[ch];
      if (!col) continue;
      const cx = flipX ? (cols - 1 - c) : c;
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(x + cx * scale), Math.round(y + r * scale), scale, scale);
    }
  }
}

  const scale = 4;

  const spriteH = pattern.length * scale;
  const flip = worm.facing < 0;
  const colorMap = worm.team === "player" ? PLAYER_COLORS : AI_COLORS;
  drawSprite(pattern, worm.x - spriteW / 2, worm.y - spriteH, scale, colorMap, flip);

  drawSprite(accPattern, worm.x - spriteW / 2, worm.y - spriteH, scale, { A: ACCESSORY_COLORS[worm.accessoryIdx] }, flip);

function drawProjectile(p) {
  if (p.type === "beetle_flying") {
    const flap = Math.floor(waterTime * 12) % 2 === 0;
    ctx.fillStyle = COLORS.outline;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 6, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.beetle;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 4.5, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.beetleStripe;
    ctx.fillRect(p.x - 1, p.y - 3, 2, 6);
    ctx.fillStyle = "rgba(240,234,216,0.6)";
    const wingY = flap ? p.y - 6 : p.y - 4;
    ctx.fillRect(p.x - 7, wingY, 5, 2);
    ctx.fillRect(p.x + 2, wingY, 5, 2);
    return;
  }
  if (p.type === "beetle_crawl") {
    const step = Math.floor(waterTime * 10) % 2 === 0;
    ctx.fillStyle = COLORS.outline;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y - 3, 6, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.beetle;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y - 3, 4.5, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.beetleStripe;
    ctx.fillRect(p.x - 1, p.y - 6, 2, 6);
    ctx.fillStyle = COLORS.outline;
    const legDx = step ? 1 : -1;
    ctx.fillRect(p.x - 6 + legDx, p.y, 3, 2);
    ctx.fillRect(p.x + 3 - legDx, p.y, 3, 2);
    if (p.crawlDelay <= 0 && Math.floor(p.fuse * 6) % 2 === 0) {
      ctx.fillStyle = COLORS.fuse;
      ctx.fillRect(p.x - 1, p.y - 10, 2, 2);
    }
    return;
  }
  ctx.fillStyle = COLORS.outline;
  ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
  if (p.type === "supergrenade") {
    ctx.fillStyle = COLORS.tomato;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    ctx.fillStyle = COLORS.tomatoLeaf;
    ctx.fillRect(p.x - 1, p.y - 3, 2, 1);
  } else {
    ctx.fillStyle = p.type === "bazooka" ? COLORS.bazooka : COLORS.grenade;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  if (isGrenadeLike(p.type) && Math.floor(p.fuse * 8) % 2 === 0) {
    ctx.fillStyle = COLORS.fuse;
    ctx.fillRect(p.x - 1, p.y - 6, 2, 2);
  }
}

function spawnExplosionEffect(x, y, radius) {

function updateExplosionEffects(dt) {
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].timer -= dt;
    if (explosions[i].timer <= 0) explosions.splice(i, 1);
  }
}

function drawExplosions() {
  for (const e of explosions) {
    const t = 1 - e.timer / e.duration;
    const r = Math.max(2, e.radius * (0.3 + 0.9 * Math.min(t * 1.6, 1)) * (1 - t * 0.35));
    ctx.fillStyle = t < 0.5 ? COLORS.fire1 : COLORS.fire2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

const HIT_PHRASES = ["УУХ!", "ООЙ!", "УУПС!", "АЙ!", "ОГО!", "БЛИН!"];

function spawnFloater(x, y, text) {
  floaters.push({ x, y, text, timer: 1.1, duration: 1.1 });
}

function updateFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.timer -= dt;
    f.y -= 22 * dt;
    if (f.timer <= 0) floaters.splice(i, 1);
  }
}

function drawFloaters() {
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.font = "bold 13px monospace";
  for (const f of floaters) {
    const alpha = clamp(f.timer / f.duration, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = COLORS.outline;
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = COLORS.fire1;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
}

const BANNER_DURATION = 1.6;

function announce(text, color) {
  state.banner = { text, color: color || COLORS.white, timer: BANNER_DURATION };
}

function updateBanner(dt) {
  if (!state.banner) return;
  state.banner.timer -= dt;
  if (state.banner.timer <= 0) state.banner = null;
}

function drawBanner() {
  if (!state.banner) return;
  const b = state.banner;
  const t = b.timer / BANNER_DURATION;
  const alpha = t > 0.72 ? (1 - t) / 0.28 : (t < 0.25 ? t / 0.25 : 1);
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold 30px monospace";
  ctx.fillStyle = COLORS.outline;
  ctx.fillText(b.text, VW / 2 + 2, 212);
  ctx.fillStyle = b.color;
  ctx.fillText(b.text, VW / 2, 210);
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
}

const CRATE_FALL_SPEED = 55;
const CRATE_PICKUP_RADIUS = 22;
const CRATE_HEAL_AMOUNT = 30;

function trySpawnCrate() {
  if (crates.length > 0) return;
  if (state.turnCount === 0 || state.turnCount % 3 !== 0) return;
  if (Math.random() >= 0.2) return;
  let x, attempts = 0;
  do {
    x = 60 + Math.random() * (WW - 120);
    attempts++;
  } while (attempts < 30 && (!hasGroundAt(x) || isDecoratedAt(x)));
  if (!hasGroundAt(x) || isDecoratedAt(x)) return;
  const kind = Math.random() < 0.5 ? "heal" : "weapon";
  crates.push({ x, y: -20, vy: CRATE_FALL_SPEED, landed: false, kind });
}

function applyCrateEffect(worm, kind) {
  playPickupSound();
  if (kind === "heal") {
    worm.hp = Math.min(worm.maxHp, worm.hp + CRATE_HEAL_AMOUNT);
    spawnFloater(worm.x, worm.y - 60, "+" + CRATE_HEAL_AMOUNT + " HP");
    announce(worm.name + ": АПТЕЧКА +" + CRATE_HEAL_AMOUNT + " HP", COLORS.hpGreen);
  } else {
    if (worm.team === "player") state.playerSuperGrenade = true;
    else state.aiSuperGrenade = true;
    spawnFloater(worm.x, worm.y - 60, "ТОМАТ-ГРАНАТА!");
    announce(worm.name + ": СУПЕР-ГРАНАТА ПОМИДОР!", COLORS.tomato);
  }
}

function updateCrates(dt) {
  for (let i = crates.length - 1; i >= 0; i--) {
    const c = crates[i];
    if (!c.landed) {
      c.y += c.vy * dt;
      const groundCol = clamp(Math.round(c.x), 0, WW - 1);
      const groundY = terrain.heights[groundCol];
      if (c.y >= groundY) {
        c.y = groundY;
        c.landed = true;
      }
    }
    const hitWorm = findWormNear(c.x, c.y - 10, CRATE_PICKUP_RADIUS);
    if (hitWorm) {
      applyCrateEffect(hitWorm, c.kind);
      crates.splice(i, 1);
    }
  }
}

function drawCrates() {
  for (const c of crates) {
    if (!c.landed) {
      ctx.strokeStyle = COLORS.chute;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(c.x - 12, c.y - 18);
      ctx.lineTo(c.x - 5, c.y - 6);
      ctx.moveTo(c.x + 12, c.y - 18);
      ctx.lineTo(c.x + 5, c.y - 6);
      ctx.stroke();
      ctx.fillStyle = COLORS.chute;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y - 22, 14, 8, 0, Math.PI, 0);
      ctx.fill();
    }
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(c.x - 9, c.y - 12, 18, 12);
    if (c.kind === "heal") {
      ctx.fillStyle = COLORS.crateHealBox;
      ctx.fillRect(c.x - 8, c.y - 11, 16, 10);
      ctx.fillStyle = COLORS.crateHealCross;
      ctx.fillRect(c.x - 6, c.y - 7, 12, 2);
      ctx.fillRect(c.x - 1, c.y - 10, 2, 8);
    } else {
      ctx.fillStyle = COLORS.crateWood;
      ctx.fillRect(c.x - 8, c.y - 11, 16, 10);
      ctx.fillStyle = COLORS.crateBand;
      ctx.fillRect(c.x - 8, c.y - 7, 16, 2);
      ctx.fillRect(c.x - 1, c.y - 11, 2, 10);
    }
  }
}

const MINE_COUNT = 4;
const MINE_TRIGGER_RADIUS = 34;
const MINE_FUSE = 0.55;
const MINE_RADIUS = 65;
const MINE_DAMAGE = 35;
const MINE_SAFE_SCREENS = new Set(["PLAYER_TURN", "AI_TURN", "AI_MOVING", "AI_CHARGING"]);

function placeMines() {
  mines = [];
  let attempts = 0;
  while (mines.length < MINE_COUNT && attempts < 200) {
    attempts++;
    const x = 70 + Math.random() * (WW - 140);
    if (!hasGroundAt(x) || isDecoratedAt(x)) continue;
    const tooCloseToWorm = worms.some(w => Math.abs(w.x - x) < 70);
    const tooCloseToMine = mines.some(m => Math.abs(m.x - x) < 90);
    if (tooCloseToWorm || tooCloseToMine) continue;
    const col = clamp(Math.round(x), 0, WW - 1);
    mines.push({ x: col, y: terrain.heights[col], vy: 0, armed: false, fuse: 0 });
  }
}

function updateMines(dt) {
  for (const mine of mines) {
    const groundCol = clamp(Math.round(mine.x), 0, WW - 1);
    const groundY = terrain.heights[groundCol];
    if (mine.y < groundY - 2) {
      mine.vy += GRAVITY * dt;
      mine.y += mine.vy * dt;
      if (mine.y >= groundY) { mine.y = groundY; mine.vy = 0; }
    } else {
      mine.y = groundY;
      mine.vy = 0;
    }

    if (!mine.armed) {
      const triggered = worms.some(w => w.alive && Math.hypot(w.x - mine.x, w.y - mine.y) < MINE_TRIGGER_RADIUS);
      if (triggered) {
        mine.armed = true;
        mine.fuse = MINE_FUSE;
        spawnFloater(mine.x, mine.y - 20, "МИНА!");
        announce("МИНА! БЕГИ!", COLORS.hpRed);
        playMineAlarmSound();
      }
      continue;
    }
    if (!MINE_SAFE_SCREENS.has(state.screen)) continue;
    mine.fuse -= dt;
    if (mine.fuse <= 0) {
      mine.exploded = true;
      detonateMine(mine);
    }
  }
  mines = mines.filter(m => !m.exploded);
}

function detonateMine(mine) {
  playExplosionSound(MINE_RADIUS);
  spawnExplosionEffect(mine.x, mine.y, MINE_RADIUS);
  digCrater(mine.x, mine.y, MINE_RADIUS);
  let hitAnyone = false;
  for (const w of worms) {
    if (!w.alive) continue;
    const wy = w.y - 14;
    const d = Math.hypot(w.x - mine.x, wy - mine.y);
    if (d < MINE_RADIUS) {
      const dmg = Math.round(MINE_DAMAGE * (1 - d / MINE_RADIUS));
      applyDamage(w, Math.max(dmg, 1));
      const ang = Math.atan2(wy - mine.y, w.x - mine.x);
      w.vy = -80 - 60 * (1 - d / MINE_RADIUS);
      w.x = clamp(w.x + Math.cos(ang) * 10, 10, WW - 10);
      w.state = "falling";
      hitAnyone = true;
    }
  }
  checkBarrelChain(mine.x, mine.y, MINE_RADIUS);
  if (hitAnyone) state.screen = "EXPLOSION";
}

function drawMines() {
  for (const m of mines) {
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(m.x - 7, m.y - 7, 14, 7);
    ctx.fillStyle = "#3c3c3c";
    ctx.fillRect(m.x - 6, m.y - 6, 12, 5);
    const blink = m.armed && Math.floor(m.fuse * 10) % 2 === 0;
    ctx.fillStyle = blink ? "#ff3020" : "#901810";
    ctx.fillRect(m.x - 2, m.y - 9, 4, 3);
  }
}

// ===== NAPALM BARRELS / FIRE =====

const BARREL_COUNT_MIN = 3;
const BARREL_COUNT_MAX = 5;
const BARREL_RADIUS = 45;
const BARREL_DAMAGE = 30;
const FIRE_ZONE_HALF_WIDTH = 55;
const FIRE_ZONE_DURATION = 5;
const FIRE_TICK_INTERVAL = 0.6;
const FIRE_TICK_DAMAGE = 7;

function placeBarrels() {
  barrels = [];
  const targetCount = BARREL_COUNT_MIN + Math.floor(Math.random() * (BARREL_COUNT_MAX - BARREL_COUNT_MIN + 1));
  let spacing = 100;
  for (let pass = 0; pass < 4 && barrels.length < BARREL_COUNT_MIN; pass++) {
    let attempts = 0;
    while (barrels.length < targetCount && attempts < 400) {
      attempts++;
      const x = 60 + Math.random() * (WW - 120);
      if (!hasGroundAt(x) || isDecoratedAt(x)) continue;
      const tooCloseToWorm = worms.some(w => Math.abs(w.x - x) < 50);
      const tooCloseToMine = mines.some(m => Math.abs(m.x - x) < 50);
      const tooCloseToBarrel = barrels.some(b => Math.abs(b.x - x) < spacing);
      if (tooCloseToWorm || tooCloseToMine || tooCloseToBarrel) continue;
      const col = clamp(Math.round(x), 0, WW - 1);
      barrels.push({ x: col, y: terrain.heights[col], vy: 0, exploded: false });
    }
    spacing *= 0.55;
  }
}

function updateBarrels(dt) {
  for (const b of barrels) {
    if (b.exploded) continue;
    const groundCol = clamp(Math.round(b.x), 0, WW - 1);
    const groundY = terrain.heights[groundCol];
    if (b.y < groundY - 2) {
      b.vy += GRAVITY * dt;
      b.y += b.vy * dt;
      if (b.y >= groundY) { b.y = groundY; b.vy = 0; }
    } else {
      b.y = groundY;
      b.vy = 0;
    }
  }
  barrels = barrels.filter(b => !b.exploded);
}

function findBarrelNear(x, y, r) {
  for (const b of barrels) {
    if (b.exploded) continue;
    if (Math.hypot(b.x - x, (b.y - 8) - y) < r) return b;
  }
  return null;
}

function spawnFireZone(x) {
  fireZones.push({ x0: x - FIRE_ZONE_HALF_WIDTH, x1: x + FIRE_ZONE_HALF_WIDTH, timer: FIRE_ZONE_DURATION, tickTimer: 0 });
}

function checkBarrelChain(x, y, radius) {
  for (const b of barrels) {
    if (b.exploded) continue;
    if (Math.hypot(b.x - x, b.y - y) < radius + 20) triggerBarrel(b);
  }
}

function triggerBarrel(barrel, firedBy) {
  if (barrel.exploded) return;
  barrel.exploded = true;
  explode(barrel.x, barrel.y, BARREL_RADIUS, BARREL_DAMAGE, firedBy);
  spawnFireZone(barrel.x);
  announce("НАПАЛМ РАЗЛИЛСЯ!", COLORS.fire2);
}

function updateFireZones(dt) {
  let anyBurnDeath = false;
  for (let i = fireZones.length - 1; i >= 0; i--) {
    const fz = fireZones[i];
    fz.timer -= dt;
    fz.tickTimer -= dt;
    if (fz.tickTimer <= 0) {
      fz.tickTimer = FIRE_TICK_INTERVAL;
      for (const w of worms) {
        if (!w.alive || w.state === "falling") continue;
        if (w.x >= fz.x0 && w.x <= fz.x1) {
          const wasAlive = w.alive;
          applyDamage(w, FIRE_TICK_DAMAGE);
          spawnFloater(w.x, w.y - 60, "ГОРИТ!");
          if (wasAlive && !w.alive) anyBurnDeath = true;
        }
      }
    }
    if (fz.timer <= 0) fireZones.splice(i, 1);
  }
  if (anyBurnDeath) {
    const playerAlive = teamWorms("player").some(w => w.alive);
    const aiAlive = teamWorms("ai").some(w => w.alive);
    if (!playerAlive || !aiAlive) {
      state.screen = "GAME_OVER";
      state.playerWon = playerAlive;
      if (playerAlive) playVictorySound(); else playDefeatSound();
      return;
    }
    if (AIM_VISIBLE_SCREENS.has(state.screen)) {
      const activeWorm = getActiveWorm(state.turn);
      if (!activeWorm || !activeWorm.alive) resolveAfterExplosion();
    }
  }
}

function drawBarrels() {
  for (const b of barrels) {
    if (b.exploded) continue;
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(b.x - 8, b.y - 17, 16, 17);
    ctx.fillStyle = "#c2401f";
    ctx.fillRect(b.x - 7, b.y - 16, 14, 15);
    ctx.fillStyle = "#8a2a12";
    ctx.fillRect(b.x - 7, b.y - 11, 14, 2);
    ctx.fillStyle = "#8a2a12";
    ctx.fillRect(b.x - 7, b.y - 5, 14, 2);
    ctx.fillStyle = COLORS.fire1;
    ctx.fillRect(b.x - 3, b.y - 15, 6, 4);
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(b.x - 3, b.y - 15, 6, 1);
  }
}

function drawFireZones() {
  for (const fz of fireZones) {
    const alpha = clamp(fz.timer / 1.0, 0, 1);
    ctx.globalAlpha = Math.min(1, alpha);
    for (let x = Math.floor(fz.x0); x <= fz.x1; x += 4) {
      const col = clamp(Math.round(x), 0, WW - 1);
      const groundY = terrain.heights[col];
      if (groundY >= WATER_BASE_LEVEL) continue;
      const flicker = 6 + Math.abs(Math.sin(x * 0.3 + waterTime * 9)) * 10;
      ctx.fillStyle = COLORS.fire2;
      ctx.fillRect(x, groundY - flicker, 3, flicker);
      ctx.fillStyle = COLORS.fire1;
      ctx.fillRect(x, groundY - flicker * 0.5, 3, flicker * 0.5);
    }
    ctx.globalAlpha = 1;
  }
}

function drawSky() {
  ctx.fillStyle = COLORS.sky1;
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = COLORS.sky2;
  ctx.fillRect(0, 140, VW, VH - 140);
  ctx.fillStyle = COLORS.white;
  for (const s of STARS) ctx.fillRect(Math.round(s.x), Math.round(s.y), 2, 2);
}

// ===== WORMS / ENTITIES =====

const PLAYER_NAMES = ["СПАЙК", "ДЮК", "ВЖИК", "БАТОН"];
const AI_NAMES = ["ГРЫЗЬ", "ШНОБЕЛЬ", "ХРЯЩ", "БИВЕНЬ"];

function makeWorm(team, idx, x) {
  const groundY = terrain.heights[clamp(Math.round(x), 0, WW - 1)];
  const names = team === "player" ? PLAYER_NAMES : AI_NAMES;
  return {
    team, idx, x, y: groundY, vy: 0,
    hp: 100, maxHp: 100, alive: true,
    name: names[idx % names.length],
    accessoryIdx: (team === "player" ? 0 : 2) + (idx % 2),
    facing: team === "player" ? 1 : -1,
    aimAngle: -30 * Math.PI / 180,
    power: 0, charging: false, targetPower: 0,
    state: "idle", animState: "idle", animTimer: 0,
  };
}

const MIN_WORM_SPACING = 55;

function placeWormsScattered() {
  const teams = ["player", "player", "player", "ai", "ai", "ai"];
  const positions = [];
  for (let i = 0; i < teams.length; i++) {
    let x, attempts = 0;
    do {
      x = 50 + Math.random() * (WW - 100);
      attempts++;
    } while (attempts < 300 && (!hasGroundAt(x) || isDecoratedAt(x) || positions.some(px => Math.abs(px - x) < MIN_WORM_SPACING)));
    positions.push(x);
  }
  const teamIdx = { player: 0, ai: 0 };
  return teams.map((team, i) => {
    const w = makeWorm(team, teamIdx[team], positions[i]);
    teamIdx[team]++;
    return w;
  });
}

function teamWorms(team) { return worms.filter(w => w.team === team); }

function getActiveWorm(team) { return teamWorms(team)[state.activeIndex[team]]; }

function advanceActiveWorm(team) {
  const arr = teamWorms(team);
  if (!arr.some(w => w.alive)) return;
  let next = (state.activeIndex[team] + 1) % arr.length;
  while (!arr[next].alive) next = (next + 1) % arr.length;
  state.activeIndex[team] = next;
}

function applyDamage(worm, dmg) {
  if (dmg > 0 && worm.alive) {
    const phrase = HIT_PHRASES[Math.floor(Math.random() * HIT_PHRASES.length)];
    spawnFloater(worm.x, worm.y - 60, phrase);
    playHitSound();
    setTimeout(playHitVoiceSound, 130);
  }
  worm.hp = Math.max(0, worm.hp - dmg);
  if (worm.hp <= 0 && worm.alive) worm.alive = false;
}

function updateWormPhysics(worm, dt) {
  if (!worm.alive) return;
  const gx = clamp(Math.round(worm.x), 0, WW - 1);
  const groundY = terrain.heights[gx];
  if (worm.state === "falling") {
    worm.vy += GRAVITY * dt;
    worm.y += worm.vy * dt;
    if (worm.y >= groundY) {
      const impact = worm.vy;
      worm.y = groundY;
      worm.vy = 0;
      worm.state = "idle";
      worm.animState = "idle";
      if (impact > FALL_DAMAGE_THRESHOLD) {
        applyDamage(worm, Math.round((impact - FALL_DAMAGE_THRESHOLD) * FALL_DAMAGE_SCALE));
      }
    }
  } else {
    if (worm.y < groundY - 2) { worm.state = "falling"; worm.vy = 0; }
    else worm.y = groundY;
  }
}

function tryMove(worm, dir, dt) {
  const nx = clamp(worm.x + dir * WALK_SPEED * dt, 10, WW - 10);
  const curCol = clamp(Math.round(worm.x), 0, WW - 1);
  const nextCol = clamp(Math.round(nx), 0, WW - 1);
  const curH = terrain.heights[curCol];
  const nextH = terrain.heights[nextCol];
  if (curH - nextH > MAX_CLIMB) return;
  worm.x = nx;
  worm.facing = dir;
  if (nextH - curH > FALL_TRIGGER) { worm.state = "falling"; worm.vy = 0; }
  else worm.y = nextH;
}

function findWormNear(x, y, r) {
  for (const w of worms) {
    if (!w.alive) continue;
    const wy = w.y - 14;
    if (Math.hypot(w.x - x, wy - y) < r) return w;
  }
  return null;
}

function explode(x, y, radius, damage, firedBy) {
  playExplosionSound(radius);
  spawnExplosionEffect(x, y, radius);
  digCrater(x, y, radius);
  for (const w of worms) {
    if (!w.alive) continue;
    const wy = w.y - 14;
    const d = Math.hypot(w.x - x, wy - y);
    if (d < radius) {
      const dmg = Math.round(damage * (1 - d / radius));
      applyDamage(w, Math.max(dmg, 1));
      const ang = Math.atan2(wy - y, w.x - x);
      w.vy = -80 - 60 * (1 - d / radius);
      w.x = clamp(w.x + Math.cos(ang) * 10, 10, WW - 10);
      w.state = "falling";
    }
  }
  checkBarrelChain(x, y, radius);
  state.screen = "EXPLOSION";
}

// ===== PROJECTILES =====

function spawnProjectile(worm, type, power) {
  playShootSound(type);
  const cfg = WEAPONS[type];
  const speed = cfg.minSpeed + power * (cfg.maxSpeed - cfg.minSpeed);
  const angle = worm.aimAngle;
  const dirX = Math.cos(angle) * worm.facing;
  const dirY = Math.sin(angle);
  const originX = worm.x + dirX * GUN_LEN;
  const originY = (worm.y - 24) + dirY * GUN_LEN;
  projectiles.push({
    type, x: originX, y: originY,
    vx: dirX * speed, vy: dirY * speed,
    ownerTeam: worm.team, bounces: 0, fuse: cfg.fuse || 0,
  });
  state.screen = "PROJECTILE";
}

const BEETLE_CRAWL_SPEED = 90;
const BEETLE_CRAWL_DELAY = 1.4; // раскачивается на месте, ПРЕЖДЕ чем таймер вообще начнёт тикать
const BEETLE_CRAWL_FUSE = 4;

function handleTerrainHit(p, x, y) {
  if (p.type === "beetle_crawl" && !p.crawling) {
    p.crawling = true;
    p.crawlDir = p.vx >= 0 ? 1 : -1;
    p.crawlDelay = BEETLE_CRAWL_DELAY;
    p.fuse = BEETLE_CRAWL_FUSE;
    p.x = x;
    p.y = y - 2;
    p.vx = 0;
    p.vy = 0;
    return false;
  }
  if (isGrenadeLike(p.type) && p.bounces < 1) {
    p.bounces++;
    p.x = x;
    p.y = y - 3;
    p.vy *= -0.45;
    p.vx *= 0.7;
    return false;
  }
  const cfg = WEAPONS[p.type];
  explode(x, y, cfg.radius, cfg.damage, p);
  return true;
}

// Живёт своей жизнью уже после приземления: ждёт BEETLE_CRAWL_DELAY (таймер
// взрыва ещё не тикает — как в Worms, сначала просто ползёт), потом тикает
// BEETLE_CRAWL_FUSE до автоподрыва; тычется в стены/обрывы — разворачивается;
// врезался в червя — взрывается сразу, не дожидаясь таймера.
function updateCrawlingBeetle(p, dt) {
  if (findWormNear(p.x, p.y - 6, WORM_HIT_RADIUS)) return true;
  if (p.crawlDelay > 0) {
    p.crawlDelay -= dt;
  } else {
    p.fuse -= dt;
    if (p.fuse <= 0) return true;
  }
  const col = clamp(Math.round(p.x), 0, WW - 1);
  const nextX = clamp(p.x + p.crawlDir * BEETLE_CRAWL_SPEED * dt, 10, WW - 10);
  const nextCol = clamp(Math.round(nextX), 0, WW - 1);
  const curH = terrain.heights[col];
  const nextH = terrain.heights[nextCol];
  if (Math.abs(nextH - curH) <= MAX_CLIMB) {
    p.x = nextX;
    p.y = nextH;
  } else {
    p.crawlDir *= -1;
  }
  return false;
}

const BEETLE_STEER_ACCEL = 500;
const BEETLE_LIFT_ACCEL = 700;
const BEETLE_MAX_SPEED = 380;

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.crawling) {
      if (updateCrawlingBeetle(p, dt)) {
        const cfg = WEAPONS[p.type];
        explode(p.x, p.y, cfg.radius, cfg.damage, p);
        projectiles.splice(i, 1);
      }
      continue;
    }
    // фитиль — общий предохранитель для всего с таймером (граната/супер-граната
    // отскакивают и взрываются по нему, летающий жук не отскакивает, но тоже
    // самоуничтожается, если не подорвался раньше об рельеф/червя)
    if (p.fuse > 0) {
      p.fuse -= dt;
      if (p.fuse <= 0) {
        const cfg = WEAPONS[p.type];
        explode(p.x, p.y, cfg.radius, cfg.damage, p);
        projectiles.splice(i, 1);
        continue;
      }
    }
    if (p.type === "beetle_flying" && p.ownerTeam === "player") {
      if (keysDown.has("ArrowLeft")) p.vx -= BEETLE_STEER_ACCEL * dt;
      if (keysDown.has("ArrowRight")) p.vx += BEETLE_STEER_ACCEL * dt;
      if (keysDown.has("ArrowUp")) p.vy -= BEETLE_LIFT_ACCEL * dt;
      p.vx = clamp(p.vx, -BEETLE_MAX_SPEED, BEETLE_MAX_SPEED);
      p.vy = clamp(p.vy, -BEETLE_MAX_SPEED, BEETLE_MAX_SPEED);
    }
    p.vx += state.wind * WIND_STRENGTH * dt;
    p.vy += GRAVITY * dt;
    const steps = 4;
    let exploded = false;
    let outOfBounds = false;
    for (let s = 0; s < steps; s++) {
      const sdt = dt / steps;
      const nx = p.x + p.vx * sdt;
      const ny = p.y + p.vy * sdt;
      if (ny >= WH) {
        const cfg = WEAPONS[p.type];
        explode(clamp(nx, 0, WW - 1), WH - 1, cfg.radius, cfg.damage, p);
        exploded = true;
        break;
      }
      if (nx >= 0 && nx < WW && ny >= 0 && ny < WH && terrain.mask[Math.floor(ny) * WW + Math.floor(nx)]) {
        exploded = handleTerrainHit(p, nx, ny);
        break;
      }
      const hitBarrel = findBarrelNear(nx, ny, WORM_HIT_RADIUS);
      if (hitBarrel) {
        triggerBarrel(hitBarrel, p);
        exploded = true;
        break;
      }
      const hitWorm = findWormNear(nx, ny, WORM_HIT_RADIUS);
      if (hitWorm) {
        const cfg = WEAPONS[p.type];
        explode(nx, ny, cfg.radius, cfg.damage, p);
        exploded = true;
        break;
      }
      p.x = nx;
      p.y = ny;
      if (p.x < -150 || p.x > WW + 150 || p.y > WH + 300) { outOfBounds = true; break; }
    }
    if (exploded) { projectiles.splice(i, 1); continue; }
    if (outOfBounds) { projectiles.splice(i, 1); state.screen = "EXPLOSION"; }
  }
}

// ===== TIMERS / SUDDEN DEATH =====

function updateTurnTimer(dt) {
  if (state.turn !== "player") return;
  if (state.screen !== "PLAYER_TURN" && state.screen !== "PROJECTILE" && state.screen !== "EXPLOSION") return;
  state.turnTimer = Math.max(0, state.turnTimer - dt);
  if (state.turnTimer <= 0 && state.screen === "PLAYER_TURN") {
    resolveAfterExplosion();
  }
}

function handlePlayerRetreatMovement(dt) {
  if (state.turn !== "player") return;
  if (state.screen !== "PROJECTILE" && state.screen !== "EXPLOSION") return;
  if (state.turnTimer <= 0) return;
  // пока свой летающий жук в воздухе, стрелки управляют им (см. updateProjectiles),
  // а не отходом червя — иначе конфликт за одни и те же клавиши
  if (projectiles.some(p => p.type === "beetle_flying" && p.ownerTeam === "player")) return;
  const worm = getActiveWorm("player");
  if (!worm || !worm.alive || worm.state === "falling") return;
  if (keysDown.has("ArrowLeft")) { tryMove(worm, -1, dt); worm.animState = "walk"; worm.animTimer += dt; }
  else if (keysDown.has("ArrowRight")) { tryMove(worm, 1, dt); worm.animState = "walk"; worm.animTimer += dt; }
  else worm.animState = "idle";
}

function updateMatchTimer(dt) {
  if (!state.suddenDeath) {
    state.matchTimer -= dt;
    if (state.matchTimer <= 0) {
      state.matchTimer = 0;
      state.suddenDeath = true;
    }
  } else {
    state.waterLevel -= WATER_RISE_SPEED * dt;
  }
}

function updateWaterDamage() {
  let anyDrowned = false;
  const deathText = state.biome === "lava" ? "СГОРЕЛ!" : "ТОНЕТ!";
  for (const w of worms) {
    if (!w.alive) continue;
    if (w.y >= state.waterLevel) {
      w.hp = 0;
      w.alive = false;
      spawnFloater(w.x, w.y - 60, deathText);
      anyDrowned = true;
    }
  }
  if (anyDrowned) {
    const playerAlive = teamWorms("player").some(w => w.alive);
    const aiAlive = teamWorms("ai").some(w => w.alive);
    if (!playerAlive || !aiAlive) {
      state.screen = "GAME_OVER";
      state.playerWon = playerAlive;
      if (playerAlive) playVictorySound(); else playDefeatSound();
      return;
    }
    if (AIM_VISIBLE_SCREENS.has(state.screen)) {
      const activeWorm = getActiveWorm(state.turn);
      if (!activeWorm || !activeWorm.alive) resolveAfterExplosion();
    }
  }
}

function updateWaterAnim(dt) {
  waterTime += dt;
}

const WATER_PALETTE = { base: "rgba(40,90,160,0.55)", waveTop: "rgba(170,215,245,0.8)", waveBottom: "rgba(190,225,250,0.35)", speed1: 2.2, speed2: 1.5 };
const LAVA_PALETTE = { base: "rgba(200,45,10,0.8)", waveTop: "rgba(255,175,40,0.85)", waveBottom: "rgba(255,90,20,0.45)", speed1: 1.0, speed2: 0.6 };

function drawWater() {
  const p = state.biome === "lava" ? LAVA_PALETTE : WATER_PALETTE;
  const y = clamp(state.waterLevel, 0, WH);
  ctx.fillStyle = p.base;
  ctx.fillRect(0, y, WW, WH - y);

  const step = 6;
  ctx.fillStyle = p.waveTop;
  for (let x = 0; x <= WW; x += step) {
    const wy = y + Math.round(Math.sin(x * 0.045 + waterTime * p.speed1) * 3);
    ctx.fillRect(x, wy, step - 1, 2);
  }
  ctx.fillStyle = p.waveBottom;
  for (let x = 0; x <= WW; x += step) {
    const wy = y + 9 + Math.round(Math.sin(x * 0.03 + waterTime * p.speed2 + 2.4) * 3);
    ctx.fillRect(x, wy, step - 1, 2);
  }
}

// ===== CAMERA =====

function cameraFocusX() {
  if (state.screen === "PROJECTILE" && projectiles.length > 0) {
    return projectiles[projectiles.length - 1].x;
  }
  if (state.screen === "EXPLOSION" && explosions.length > 0) {
    return explosions[explosions.length - 1].x;
  }
  const worm = getActiveWorm(state.turn);
  return worm ? worm.x : camera.x + VW / 2;
}

function updateCamera(dt) {
  const maxX = Math.max(0, WW - VW);
  if (state.screen === "MENU" || state.screen === "INTRO") { camera.x = clamp(camera.x, 0, maxX); return; }
  const desired = clamp(cameraFocusX() - VW / 2, 0, maxX);
  camera.x += (desired - camera.x) * Math.min(1, dt * 6);
}

const INTRO_HOLD = 0.35;
const INTRO_PAN = 0.9;
const INTRO_RETURN = 0.7;

function easeInOut(t) { return t * t * (3 - 2 * t); }

function updateIntroPan(dt) {
  state.introTimer += dt;
  const t = state.introTimer;
  const maxX = Math.max(0, WW - VW);
  const xs = worms.map(w => w.x);
  const minWormX = xs.length ? Math.min(...xs) : 0;
  const maxWormX = xs.length ? Math.max(...xs) : WW;
  const leftX = clamp(minWormX - VW / 2, 0, maxX);
  const rightX = clamp(maxWormX - VW / 2, 0, maxX);
  const finalX = clamp(getActiveWorm("player").x - VW / 2, 0, maxX);

  if (t < INTRO_HOLD) {
    camera.x = leftX;
  } else if (t < INTRO_HOLD + INTRO_PAN) {
    camera.x = leftX + (rightX - leftX) * easeInOut((t - INTRO_HOLD) / INTRO_PAN);
  } else if (t < INTRO_HOLD * 2 + INTRO_PAN) {
    camera.x = rightX;
  } else if (t < INTRO_HOLD * 2 + INTRO_PAN + INTRO_RETURN) {
    camera.x = rightX + (finalX - rightX) * easeInOut((t - (INTRO_HOLD * 2 + INTRO_PAN)) / INTRO_RETURN);
  } else {
    camera.x = finalX;
    state.screen = "PLAYER_TURN";
    announce("ХОД: " + getActiveWorm("player").name, COLORS.fire1);
  }
}

// ===== TURN / STATE MACHINE =====

function allWormsGrounded() {
  return worms.every(w => !w.alive || w.state !== "falling");
}

function updateExplosionState() {
  if (explosions.length === 0 && projectiles.length === 0 && allWormsGrounded()) resolveAfterExplosion();
}

function resolveAfterExplosion() {
  const playerAlive = teamWorms("player").some(w => w.alive);
  const aiAlive = teamWorms("ai").some(w => w.alive);
  if (!playerAlive || !aiAlive) {
    state.screen = "GAME_OVER";
    state.playerWon = playerAlive;
    if (playerAlive) playVictorySound(); else playDefeatSound();
    return;
  }
  playTurnChimeSound();
  state.turn = state.turn === "player" ? "ai" : "player";
  advanceActiveWorm(state.turn);
  state.turnCount++;
  trySpawnCrate();
  if (state.turn === "player") {
    state.wind = Math.random() * 2 - 1;
    state.turnTimer = TURN_TIME_LIMIT;
    state.jetpackFuel = 1;
    state.screen = "PLAYER_TURN";
    announce("ХОД: " + getActiveWorm("player").name, COLORS.fire1);
  } else {
    const pause = aiDifficulty().reactionPause;
    state.aiPauseTimer = pause[0] + Math.random() * (pause[1] - pause[0]);
    state.screen = "AI_TURN";
    announce("ХОД ПРОТИВНИКА: " + getActiveWorm("ai").name, COLORS.hpRed);
  }
}

function selectWeapon(type) {
  if (state.screen !== "PLAYER_TURN") return;
  state.playerWeapon = type;
  // ни у бомжранца, ни у биты нет заряда выстрела — если игрок переключился
  // на них с базуки/гранаты посреди набора силы, сбросить набор, иначе при
  // отпускании Space ударит по несуществующему WEAPONS["bat"/"jetpack"].
  if (type === "jetpack" || type === "bat" || type === "dynamite") {
    const worm = getActiveWorm("player");
    if (worm) { worm.charging = false; worm.power = 0; }
  }
}

function selectDifficulty(level) {
  if (state.screen === "MENU" || state.screen === "GAME_OVER") state.difficulty = level;
}

const AIR_MOVE_SPEED = 120;
const JETPACK_THRUST_ACCEL = 1600;
const JETPACK_MAX_VY = -260; // потолок скорости подъёма — иначе тяга без ограничения разгоняет червя до бесконечности
const JETPACK_FUEL_DRAIN = 0.6; // полный бак ~1.7с непрерывной тяги
const BAT_SWING_DURATION = 0.22;
const BAT_RANGE = 62;
const BAT_DAMAGE = 20;
const BAT_KNOCKBACK_DIST = 55;
const BAT_KNOCKBACK_VY = -230;

function tryAirMove(worm, dir, dt) {
  worm.x = clamp(worm.x + dir * AIR_MOVE_SPEED * dt, 10, WW - 10);
  worm.facing = dir;
}

// Ищет живого червя впереди атакующего (не позади) в радиусе удара биты.
function findBatTarget(worm) {
  const px = worm.x + worm.facing * 10;
  const py = worm.y - 14;
  let best = null, bestD = BAT_RANGE;
  for (const w of worms) {
    if (w === worm || !w.alive) continue;
    const wy = w.y - 14;
    const d = Math.hypot(w.x - px, wy - py);
    const inFront = (w.x - worm.x) * worm.facing > -10;
    if (d < bestD && inFront) { best = w; bestD = d; }
  }
  return best;
}

// Замах биты отыгрывает отдельным коротким окном (BAT_SWING_DURATION), удар
// прикладывается по его истечении — см. вызов в updatePlayerTurn.
function resolveBatSwing(worm) {
  const target = findBatTarget(worm);
  if (target) {
    applyDamage(target, BAT_DAMAGE);
    target.x = clamp(target.x + worm.facing * BAT_KNOCKBACK_DIST, 10, WW - 10);
    target.vy = BAT_KNOCKBACK_VY;
    target.state = "falling";
    announce(worm.name + ": УДАР БИТОЙ!", worm.team === "player" ? COLORS.fire1 : COLORS.hpRed);
  }
  state.turnTimer = RETREAT_TIME;
  state.screen = "EXPLOSION";
}

const DYNAMITE_FUSE = RETREAT_TIME; // ровно окно отхода — рвануть должно, когда контроль
                                     // над отходом (handlePlayerRetreatMovement) как раз кончается
const DYNAMITE_RADIUS = 58;
const DYNAMITE_DAMAGE = 45;

// Закладка мгновенная (как замах биты), но не взрывается сама — тикает
// независимо в updateDynamites(), а экран уходит в "PROJECTILE", чтобы
// сработал тот же handlePlayerRetreatMovement, что даёт отойти после выстрела.
function handleDynamitePlant(worm) {
  dynamites.push({ x: worm.x, y: worm.y - 6, fuse: DYNAMITE_FUSE, ownerTeam: worm.team });
  playDynamitePlantSound();
  announce(worm.name + ": ДИНАМИТ ЗАЛОЖЕН!", worm.team === "player" ? COLORS.fire1 : COLORS.hpRed);
  state.turnTimer = RETREAT_TIME;
  state.screen = "PROJECTILE";
}

function updateDynamites(dt) {
  for (let i = dynamites.length - 1; i >= 0; i--) {
    const d = dynamites[i];
    d.fuse -= dt;
    if (d.fuse <= 0) {
      dynamites.splice(i, 1);
      explode(d.x, d.y, DYNAMITE_RADIUS, DYNAMITE_DAMAGE, null);
    }
  }
}

function drawDynamites() {
  for (const d of dynamites) {
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(d.x - 4, d.y - 12, 8, 14);
    ctx.fillStyle = COLORS.dynamite;
    ctx.fillRect(d.x - 3, d.y - 11, 6, 12);
    ctx.fillStyle = "#8a2020";
    ctx.fillRect(d.x - 3, d.y - 6, 6, 2);
    if (Math.floor(d.fuse * 6) % 2 === 0) {
      ctx.fillStyle = COLORS.fuse;
      ctx.fillRect(d.x - 1, d.y - 15, 2, 3);
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.font = "bold 11px monospace";
    const label = d.fuse.toFixed(1) + "с";
    ctx.fillStyle = COLORS.outline;
    ctx.fillText(label, d.x + 1, d.y - 17);
    ctx.fillStyle = d.fuse < 1.5 ? COLORS.hpRed : COLORS.dynamiteLabel;
    ctx.fillText(label, d.x, d.y - 18);
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
  }
}

function applyJetpackFuel(worm, thrusting, dt) {
  if (thrusting) {
    state.jetpackFuel = Math.max(0, state.jetpackFuel - JETPACK_FUEL_DRAIN * dt);
    if (!worm.jetpackThrusting) playJetpackSound();
    worm.jetpackThrusting = true;
  } else {
    worm.jetpackThrusting = false;
  }
}

function updatePlayerTurn(dt) {
  const worm = getActiveWorm("player");
  if (!worm || !worm.alive) return;
  const thrusting = state.playerWeapon === "jetpack" && keysDown.has("ArrowUp") && state.jetpackFuel > 0;

  if (worm.state === "falling") {
    let airMoving = false;
    if (keysDown.has("ArrowLeft")) { tryAirMove(worm, -1, dt); airMoving = true; }
    if (keysDown.has("ArrowRight")) { tryAirMove(worm, 1, dt); airMoving = true; }
    if (thrusting) { worm.vy = Math.max(worm.vy - JETPACK_THRUST_ACCEL * dt, JETPACK_MAX_VY); airMoving = true; }
    applyJetpackFuel(worm, thrusting, dt);
    worm.animState = airMoving ? "walk" : "idle";
    if (airMoving) worm.animTimer += dt;
    return;
  }

  if (worm.batSwingTimer > 0) {
    worm.batSwingTimer -= dt;
    if (worm.batSwingTimer <= 0) {
      worm.batSwingTimer = 0;
      resolveBatSwing(worm);
    }
    return;
  }

  let moving = false;
  if (keysDown.has("ArrowLeft")) { tryMove(worm, -1, dt); moving = true; }
  if (keysDown.has("ArrowRight")) { tryMove(worm, 1, dt); moving = true; }
  if (thrusting) {
    worm.state = "falling";
    worm.vy = Math.max(-JETPACK_THRUST_ACCEL * dt, JETPACK_MAX_VY);
  } else if (state.playerWeapon !== "jetpack" && state.playerWeapon !== "bat" && state.playerWeapon !== "dynamite") {
    if (keysDown.has("ArrowUp")) worm.aimAngle = clamp(worm.aimAngle - AIM_SPEED * dt, -MAX_AIM, MAX_AIM);
    if (keysDown.has("ArrowDown")) worm.aimAngle = clamp(worm.aimAngle + AIM_SPEED * dt, -MAX_AIM, MAX_AIM);
  }
  applyJetpackFuel(worm, thrusting, dt);
  worm.animState = moving ? "walk" : "idle";
  if (moving) worm.animTimer += dt;
  if (worm.charging) worm.power = clamp(worm.power + dt / CHARGE_TIME, 0, 1);
}

function handleSpaceDown() {
  if (state.screen !== "PLAYER_TURN") return;
  const worm = getActiveWorm("player");
  if (!worm || !worm.alive || worm.state === "falling") return;
  if (state.playerWeapon === "jetpack") return;
  if (state.playerWeapon === "dynamite") {
    handleDynamitePlant(worm);
    return;
  }
  if (state.playerWeapon === "bat") {
    if (worm.batSwingTimer > 0) return;
    worm.batSwingTimer = BAT_SWING_DURATION;
    playBatSwingSound();
    return;
  }
  worm.charging = true;
  worm.power = 0;
}

function handleSpaceRelease() {
  if (state.screen !== "PLAYER_TURN") return;
  const worm = getActiveWorm("player");
  if (!worm || !worm.alive || !worm.charging) return;
  worm.charging = false;
  if (state.playerWeapon === "jetpack") { worm.power = 0; return; }
  const power = Math.max(worm.power, 0.12);
  let weaponType = state.playerWeapon;
  if (weaponType === "grenade" && state.playerSuperGrenade) {
    weaponType = "supergrenade";
    state.playerSuperGrenade = false;
  }
  spawnProjectile(worm, weaponType, power);
  worm.power = 0;
  state.turnTimer = RETREAT_TIME;
}

const JUMP_VY = -260;

function handleJump() {
  if (state.screen !== "PLAYER_TURN") return;
  const worm = getActiveWorm("player");
  if (!worm || !worm.alive || worm.state === "falling") return;
  worm.vy = JUMP_VY;
  worm.state = "falling";
  playJumpSound();
}

function nearestOf(list, aiWorm) {
  return list.reduce((best, w) => (Math.abs(w.x - aiWorm.x) < Math.abs(best.x - aiWorm.x) ? w : best));
}

// Грубая оценка максимальной дальности оружия (плоская земля, без ветра) —
// используется только как фильтр "вообще может долететь", не для точного прицела.
function weaponMaxRange(weaponType) {
  const cfg = WEAPONS[weaponType];
  const baseAngleDeg = isGrenadeLike(weaponType) ? 55 : 47;
  return (cfg.maxSpeed * cfg.maxSpeed * Math.sin(2 * baseAngleDeg * Math.PI / 180)) / GRAVITY;
}

function pickPlayerTarget(aiWorm) {
  const preset = aiDifficulty();
  const alive = teamWorms("player").filter(w => w.alive);
  // Добивать раненого приоритетно, но только если до него реально можно дострелить —
  // иначе ИИ игнорировал близкого целого противника ради дальнего почти мёртвого,
  // до которого всё равно не долетал ни один выстрел.
  const reachRange = Math.max(weaponMaxRange("bazooka"), weaponMaxRange("grenade")) * 1.15;
  const finishable = alive.filter(w => w.hp <= preset.finishHpThreshold && Math.abs(w.x - aiWorm.x) <= reachRange);
  if (finishable.length > 0 && Math.random() < preset.killPriorityChance) return nearestOf(finishable, aiWorm);
  if (Math.random() < preset.randomTargetChance) return alive[Math.floor(Math.random() * alive.length)];
  return nearestOf(alive, aiWorm);
}

function pathIsSafe(worm, dir, dist) {
  const steps = Math.max(1, Math.ceil(dist / 20));
  let prevH = terrain.heights[clamp(Math.round(worm.x), 0, WW - 1)];
  for (let i = 1; i <= steps; i++) {
    const x = worm.x + dir * (dist * i / steps);
    if (!hasGroundAt(x)) return false;
    const col = clamp(Math.round(x), 0, WW - 1);
    const h = terrain.heights[col];
    if (Math.abs(h - prevH) > FALL_TRIGGER) return false;
    prevH = h;
  }
  return true;
}

function lineOfSightBlocked(worm, target) {
  const x0 = worm.x, y0 = worm.y - 24;
  const x1 = target.x, y1 = target.y - 24;
  const steps = 10;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const sx = x0 + (x1 - x0) * t;
    const sy = y0 + (y1 - y0) * t;
    const col = clamp(Math.round(sx), 0, WW - 1);
    if (terrain.heights[col] < sy - 6) return true;
  }
  return false;
}

function estimateAiAim(worm, target, weaponType) {
  const cfg = WEAPONS[weaponType];
  const baseAngleDeg = isGrenadeLike(weaponType) ? 55 : 47;
  const facing = target.x >= worm.x ? 1 : -1;

  // Rough pre-pass at the default steep arc, just to get a first distance estimate.
  const a0 = -baseAngleDeg * Math.PI / 180;
  const ox0 = worm.x + Math.cos(a0) * facing * GUN_LEN;
  const dist0 = Math.abs(target.x - ox0);
  // At minSpeed, the default steep arc already covers more ground than dist0 — power
  // is clamped at 0.15, so nothing below minSpeed exists to shrink the shot further,
  // and it systematically overshoots close targets. Flatten the arc until minSpeed's
  // own minimum range roughly matches the target distance, so power has room to tune
  // an actually-short shot instead of always firing a minimum-power long one.
  let angleDeg = baseAngleDeg;
  const minRangeAtBase = (cfg.minSpeed * cfg.minSpeed * Math.sin(2 * baseAngleDeg * Math.PI / 180)) / GRAVITY;
  if (dist0 < minRangeAtBase) {
    const sinTwoTheta = clamp((dist0 * GRAVITY) / (cfg.minSpeed * cfg.minSpeed), 0.06, 1);
    angleDeg = clamp((Math.asin(sinTwoTheta) * 180 / Math.PI) / 2, 8, baseAngleDeg);
  }
  const angle = -angleDeg * Math.PI / 180;
  const originX = worm.x + Math.cos(angle) * facing * GUN_LEN;
  const originY = (worm.y - 24) + Math.sin(angle) * GUN_LEN;
  const rawDist = Math.abs(target.x - originX);
  const dyRel = (target.y - 14) - originY;
  const cos = Math.cos(angle), tan = Math.sin(angle) / cos;
  // Ветер толкает снаряд в полёте (см. updateProjectiles: p.vx += wind*WIND_STRENGTH*dt),
  // но сама баллистическая формула ниже его не знает. Два прохода: первый прикидывает
  // время полёта без ветра, второй компенсирует снос за это время, подправляя
  // "эффективную" дистанцию, под которую решается баллистика.
  let dist = rawDist;
  let speed = cfg.maxSpeed * 0.75;
  for (let pass = 0; pass < 2; pass++) {
    const denom = cos * cos * (dyRel - dist * tan);
    if (denom > 1) {
      speed = Math.sqrt((0.5 * GRAVITY * dist * dist) / denom);
    } else {
      speed = cfg.maxSpeed * 0.75;
    }
    speed = clamp(speed, cfg.minSpeed, cfg.maxSpeed * 1.05);
    const vx0 = Math.abs(cos * speed);
    const flightTime = vx0 > 1 ? rawDist / vx0 : 0;
    const windDriftAlongPath = facing * 0.5 * state.wind * WIND_STRENGTH * flightTime * flightTime;
    dist = clamp(rawDist - windDriftAlongPath, rawDist * 0.4, rawDist * 1.6);
  }
  const power = clamp((speed - cfg.minSpeed) / (cfg.maxSpeed - cfg.minSpeed), 0.15, 1);
  return { angle, power };
}

function updateAiTurnPause(dt) {
  state.aiPauseTimer -= dt;
  if (state.aiPauseTimer <= 0) {
    prepareAiShot();
    if (state.aiMoveTimer > 0) {
      state.screen = "AI_MOVING";
    } else {
      getActiveWorm("ai").charging = true;
      state.screen = "AI_CHARGING";
    }
  }
}

// Считает угол/мощность под текущую позицию червя и применяет шум сложности.
// Вынесено отдельно, чтобы пере-прицелиться после AI_MOVING — иначе выстрел летит
// туда, где цель была ДО того, как ИИ сам сдвинулся с места.
function aimAtTarget(worm, target, weaponType, preset) {
  const aim = estimateAiAim(worm, target, weaponType);
  const angleNoise = preset.angleNoiseDeg * Math.PI / 180;
  const angle = aim.angle + (Math.random() * 2 - 1) * angleNoise;
  const power = clamp(aim.power + (Math.random() * 2 - 1) * preset.powerNoise, 0.15, 1);
  worm.aimAngle = clamp(angle, -MAX_AIM, MAX_AIM);
  worm.targetPower = power;
  worm.power = 0;
}

function prepareAiShot() {
  const preset = aiDifficulty();
  const worm = getActiveWorm("ai");
  const target = pickPlayerTarget(worm);
  const dx = target.x - worm.x;
  worm.facing = dx >= 0 ? 1 : -1;
  worm.shootFacing = worm.facing;

  const blocked = lineOfSightBlocked(worm, target);
  const preferGrenade = blocked || Math.abs(worm.y - target.y) > 90;
  const bestWeapon = preferGrenade ? "grenade" : "bazooka";
  const otherWeapon = preferGrenade ? "bazooka" : "grenade";
  state.aiWeapon = Math.random() < preset.weaponSkill ? bestWeapon : otherWeapon;

  worm.aiWantsSuper = false;
  if (state.aiSuperGrenade && state.aiWeapon === "grenade") {
    const clusterCount = teamWorms("player").filter(w => w.alive && Math.hypot(w.x - target.x, w.y - target.y) < 70).length;
    worm.aiWantsSuper = clusterCount >= preset.superClusterThreshold;
  }

  worm.aiAimTarget = target;
  aimAtTarget(worm, target, worm.aiWantsSuper ? "supergrenade" : state.aiWeapon, preset);

  const teammate = teamWorms("ai").find(w => w !== worm && w.alive);
  const bunched = teammate && Math.abs(worm.x - teammate.x) < 70;

  const lookAheadCol = clamp(Math.round(worm.x + worm.facing * 24), 0, WW - 1);
  const curCol = clamp(Math.round(worm.x), 0, WW - 1);
  const nearEdge = Math.abs(terrain.heights[lookAheadCol] - terrain.heights[curCol]) > FALL_TRIGGER;

  const bestRange = Math.max(weaponMaxRange("bazooka"), weaponMaxRange("grenade"));
  const outOfRange = Math.abs(target.x - worm.x) > bestRange * 0.92;

  state.aiMoveDir = 0;
  state.aiMoveTimer = 0;
  if (outOfRange) {
    // Приоритет выше, чем у "скучились"/"край обрыва" — без сближения выстрел
    // заведомо не долетит, какой бы точной ни была баллистика.
    const dir = worm.facing;
    const dist = 0.7 * WALK_SPEED;
    if (pathIsSafe(worm, dir, dist)) {
      state.aiMoveDir = dir;
      state.aiMoveTimer = 0.6 + Math.random() * 0.4;
    }
  } else if (bunched) {
    const dir = worm.x < teammate.x ? -1 : 1;
    const dist = 0.6 * WALK_SPEED;
    if (pathIsSafe(worm, dir, dist)) {
      state.aiMoveDir = dir;
      state.aiMoveTimer = 0.6 + Math.random() * 0.4;
    }
  } else if (nearEdge) {
    const dir = -worm.facing;
    const dist = 0.5 * WALK_SPEED;
    if (pathIsSafe(worm, dir, dist)) {
      state.aiMoveDir = dir;
      state.aiMoveTimer = 0.5 + Math.random() * 0.3;
    }
  }
}

function updateAiMoving(dt) {
  const worm = getActiveWorm("ai");
  state.aiMoveTimer -= dt;
  if (state.aiMoveDir !== 0 && worm.state !== "falling") {
    tryMove(worm, state.aiMoveDir, dt);
    worm.animState = "walk";
    worm.animTimer += dt;
  } else {
    worm.animState = "idle";
  }
  if (state.aiMoveTimer <= 0) {
    worm.animState = "idle";
    worm.facing = worm.shootFacing;
    if (worm.aiAimTarget && worm.aiAimTarget.alive) {
      const weaponType = worm.aiWantsSuper ? "supergrenade" : state.aiWeapon;
      aimAtTarget(worm, worm.aiAimTarget, weaponType, aiDifficulty());
    }
    worm.charging = true;
    state.screen = "AI_CHARGING";
  }
}

function updateAiCharging(dt) {
  const worm = getActiveWorm("ai");
  worm.power = Math.min(worm.targetPower, worm.power + dt / (CHARGE_TIME * 0.6));
  if (worm.power >= worm.targetPower - 0.001) {
    worm.charging = false;
    let weaponType = state.aiWeapon;
    if (weaponType === "grenade" && state.aiSuperGrenade && worm.aiWantsSuper) {
      weaponType = "supergrenade";
      state.aiSuperGrenade = false;
    }
    spawnProjectile(worm, weaponType, worm.power);
    worm.power = 0;
  }
}

function startMatch() {
  terrain = generateTerrain();
  redrawTerrainColumns(0, WW - 1);
  worms = placeWormsScattered();
  projectiles = [];
  explosions = [];
  floaters = [];
  crates = [];
  fireZones = [];
  dynamites = [];
  placeMines();
  placeBarrels();
  state.turn = "player";
  state.activeIndex = { player: 0, ai: 0 };
  camera.x = clamp(Math.min(...worms.map(w => w.x)) - VW / 2, 0, Math.max(0, WW - VW));
  state.wind = Math.random() * 2 - 1;
  state.playerWeapon = "bazooka";
  state.playerSuperGrenade = false;
  state.aiSuperGrenade = false;
  state.jetpackFuel = 1;
  state.turnCount = 0;
  state.turnTimer = TURN_TIME_LIMIT;

  state.suddenDeath = false;

}

function handleEnter() {
  if (state.screen === "MENU" || state.screen === "GAME_OVER") startMatch();
}

// ===== HUD =====

function drawWeaponIcon(x, y, type) {
  if (type === "grenade") {
    ctx.fillStyle = COLORS.outline;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.grenade;
    ctx.beginPath();
    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(x - 1, y - 9, 2, 4);
  } else if (type === "jetpack") {
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(x - 5, y - 7, 10, 14);
    ctx.fillStyle = COLORS.jetpack;
    ctx.fillRect(x - 4, y - 6, 8, 12);
    ctx.fillStyle = COLORS.jetpackDark;
    ctx.fillRect(x - 4, y - 6, 3, 12);
    ctx.fillStyle = COLORS.fire1;
    ctx.fillRect(x - 2, y + 6, 4, 3);
  } else if (type === "bat") {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.6);
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(-3, -9, 6, 18);
    ctx.fillStyle = COLORS.bat;
    ctx.fillRect(-2, -8, 4, 14);
    ctx.fillStyle = COLORS.batGrip;
    ctx.fillRect(-2, 6, 4, 5);
    ctx.restore();
  } else if (type === "beetle_flying" || type === "beetle_crawl") {
    ctx.fillStyle = COLORS.outline;
    ctx.beginPath();
    ctx.ellipse(x, y, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.beetle;
    ctx.beginPath();
    ctx.ellipse(x, y, 5.5, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.beetleStripe;
    ctx.fillRect(x - 1, y - 3, 2, 6);
  } else if (type === "dynamite") {
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(x - 3, y - 7, 6, 12);
    ctx.fillStyle = COLORS.dynamite;
    ctx.fillRect(x - 2, y - 6, 4, 10);
    ctx.fillStyle = COLORS.fuse;
    ctx.fillRect(x - 1, y - 9, 2, 3);
  } else {
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(x - 9, y - 4, 18, 8);
    ctx.fillStyle = COLORS.bazooka;
    ctx.fillRect(x - 8, y - 3, 15, 6);
    ctx.fillStyle = "#8a8a8a";
    ctx.fillRect(x + 5, y - 4, 4, 8);
  }
}

function drawHazardIcon(x, y, isLava) {
  if (isLava) {
    ctx.fillStyle = COLORS.fire2;
    ctx.beginPath();
    ctx.moveTo(x, y + 7);
    ctx.quadraticCurveTo(x - 5, y - 1, x, y - 8);
    ctx.quadraticCurveTo(x + 5, y - 1, x, y + 7);
    ctx.fill();
    ctx.fillStyle = COLORS.fire1;
    ctx.beginPath();
    ctx.moveTo(x, y + 4);
    ctx.quadraticCurveTo(x - 2, y, x, y - 4);
    ctx.quadraticCurveTo(x + 2, y, x, y + 4);
    ctx.fill();
  } else {
    ctx.fillStyle = "#4a90d8";
    ctx.beginPath();
    ctx.moveTo(x, y - 8);
    ctx.quadraticCurveTo(x - 6, y + 2, x, y + 7);
    ctx.quadraticCurveTo(x + 6, y + 2, x, y - 8);
    ctx.fill();
  }
}

function drawSpeakerIcon(x, y, muted) {
  ctx.fillStyle = muted ? "rgba(240,234,216,0.5)" : COLORS.white;
  ctx.beginPath();
  ctx.moveTo(x - 6, y - 3);
  ctx.lineTo(x - 3, y - 3);
  ctx.lineTo(x + 1, y - 6);
  ctx.lineTo(x + 1, y + 6);
  ctx.lineTo(x - 3, y + 3);
  ctx.lineTo(x - 6, y + 3);
  ctx.closePath();
  ctx.fill();
  if (muted) {
    ctx.strokeStyle = COLORS.hpRed;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + 3, y - 5);
    ctx.lineTo(x + 9, y + 5);
    ctx.moveTo(x + 9, y - 5);
    ctx.lineTo(x + 3, y + 5);
    ctx.stroke();
  } else {
    ctx.strokeStyle = COLORS.white;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x + 2, y, 6, -0.6, 0.6);
    ctx.stroke();
  }
}

function drawTurnTimerBar(x, y, w, h) {
  const pct = clamp(state.turnTimer / TURN_TIME_LIMIT, 0, 1);
  ctx.fillStyle = COLORS.hpBg;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = state.turnTimer <= 5 ? COLORS.hpRed : COLORS.hpGreen;
  ctx.fillRect(x, y, w * pct, h);
  ctx.strokeStyle = COLORS.outline;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function drawHUD() {
  if (state.screen === "MENU" || state.screen === "GAME_OVER" || state.screen === "INTRO") return;

  // top bar is inset from the very top/edges so the rounded CRT bezel never clips it
  const barTop = 20, barH = 30, marginX = 58;
  ctx.fillStyle = "rgba(10,8,6,0.62)";
  ctx.fillRect(0, barTop, VW, barH);
  ctx.textBaseline = "top";

  // left zone: whose turn + turn timer bar (with seconds readout)
  ctx.textAlign = "left";
  ctx.font = "bold 14px monospace";
  ctx.fillStyle = state.turn === "player" ? COLORS.fire1 : COLORS.hpRed;
  ctx.fillText(state.turn === "player" ? "ВАШ ХОД" : "ХОД ПРОТИВНИКА", marginX, barTop + 4);
  if (state.turn === "player" && (state.screen === "PLAYER_TURN" || state.screen === "PROJECTILE" || state.screen === "EXPLOSION")) {
    drawTurnTimerBar(marginX, barTop + 20, 110, 6);
    ctx.font = "bold 11px monospace";
    ctx.fillStyle = state.turnTimer <= 5 ? COLORS.hpRed : COLORS.white;
    ctx.fillText(Math.ceil(state.turnTimer) + "с", marginX + 116, barTop + 19);
  }

  // center zone: wind gauge
  const cx = VW / 2;
  ctx.textAlign = "center";
  ctx.font = "10px monospace";
  ctx.fillStyle = "rgba(240,234,216,0.75)";
  ctx.fillText("ВЕТЕР", cx, barTop + 2);
  const gaugeW = 74, gaugeX = cx - gaugeW / 2, gaugeY = barTop + 16;
  ctx.strokeStyle = "rgba(240,234,216,0.4)";
  ctx.lineWidth = 1;
  ctx.strokeRect(gaugeX + 0.5, gaugeY + 0.5, gaugeW, 6);
  ctx.fillStyle = "rgba(240,234,216,0.15)";
  ctx.fillRect(gaugeX, gaugeY, gaugeW, 6);
  ctx.fillStyle = "rgba(240,234,216,0.5)";
  ctx.fillRect(cx - 0.5, gaugeY - 1, 1, 8);
  const windPct = clamp(state.wind, -1, 1);
  const markerX = cx + windPct * (gaugeW / 2 - 3);
  ctx.fillStyle = Math.abs(state.wind) < 0.05 ? COLORS.white : COLORS.fire1;
  ctx.fillRect(markerX - 2, gaugeY - 2, 4, 10);

  // right zone: hazard countdown (whole top bar to itself now, weapon moved to its own panel below)
  ctx.textAlign = "right";
  ctx.font = "bold 12px monospace";
  const isLava = state.biome === "lava";
  const hazardLabel = state.suddenDeath
    ? (isLava ? "ЛАВА ПОДНИМАЕТСЯ!" : "ВОДА ПОДНИМАЕТСЯ!")
    : "ДО ЗАТОПЛЕНИЯ " + (isLava ? "ЛАВОЙ" : "ВОДОЙ") + ": " + Math.ceil(state.matchTimer) + "с";
  ctx.fillStyle = state.suddenDeath ? COLORS.hpRed : "rgba(240,234,216,0.85)";
  ctx.fillText(hazardLabel, VW - marginX, barTop + 9);
  drawHazardIcon(VW - marginX - ctx.measureText(hazardLabel).width - 12, barTop + 11, isLava);

  // dedicated weapon panel, left side, below the top bar — was cramped into a
  // corner of the top bar before and hard to read, now its own visible block.
  const weaponName = state.turn === "player" ? state.playerWeapon : state.aiWeapon;
  const hasSuper = state.turn === "player" ? state.playerSuperGrenade : state.aiSuperGrenade;
  // турборанцу и жуку-лётчику стрелки нужны не так, как обычному оружию —
  // подсказка в нижней панели редко замечается, поэтому дублируем прямо тут
  const wpX = marginX, wpY = barTop + barH + 10, wpW = 190, wpH = weaponName === "jetpack" ? 58 : 42;
  ctx.fillStyle = "rgba(10,8,6,0.62)";
  ctx.fillRect(wpX, wpY, wpW, wpH);
  ctx.strokeStyle = "rgba(240,234,216,0.35)";
  ctx.lineWidth = 1;
  ctx.strokeRect(wpX + 0.5, wpY + 0.5, wpW - 1, wpH - 1);
  drawWeaponIcon(wpX + 20, wpY + 20, weaponName);

  ctx.textAlign = "left";
  ctx.font = "bold 15px monospace";
  const WEAPON_LABELS = { bazooka: "БАЗУКА [1]", grenade: "ГРАНАТА [2]", jetpack: "ТУРБОРАНЕЦ [3]", bat: "БИТА [4]", beetle_flying: "ЖУК-ЛЁТЧИК [5]", dynamite: "ДИНАМИТ [6]", beetle_crawl: "ЖУК-ПОЛЗУН [7]" };
  const weaponMainLabel = WEAPON_LABELS[weaponName] || weaponName;
  const lowFuel = weaponName === "jetpack" && state.jetpackFuel < 0.25;
  ctx.fillStyle = lowFuel ? COLORS.hpRed : COLORS.white;
  ctx.fillText(weaponMainLabel, wpX + 40, wpY + 9);

  ctx.font = "11px monospace";
  if (hasSuper) {
    ctx.fillStyle = COLORS.tomato;
    ctx.fillText("+ТОМАТ", wpX + 40, wpY + 27);
  } else if (weaponName === "jetpack") {
    ctx.fillStyle = lowFuel ? COLORS.hpRed : "rgba(240,234,216,0.8)";
    ctx.fillText("ТОПЛИВО: " + Math.round(state.jetpackFuel * 100) + "%", wpX + 40, wpY + 27);
  } else if (weaponName === "beetle_flying") {
    ctx.fillStyle = "rgba(240,234,216,0.8)";
    ctx.fillText("← → ↑ РУЛИТЬ В ПОЛЁТЕ", wpX + 40, wpY + 27);
  }
  if (weaponName === "jetpack") {
    ctx.fillStyle = "rgba(240,234,216,0.7)";
    ctx.fillText("↑ ТЯГА, ← → ПОЛЁТ", wpX + 40, wpY + 45);
  }

  const shooter = getActiveWorm(state.turn);
  if (shooter && shooter.charging) {
    const bw = 220, bh = 14, bx = (VW - bw) / 2, by = VH - 46;
    ctx.fillStyle = COLORS.hpBg;
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = COLORS.fire1;
    ctx.fillRect(bx, by, bw * shooter.power, bh);
    ctx.strokeStyle = COLORS.outline;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  }
  drawControlHints();
}

}

  ctx.font = "bold 22px monospace";
  ctx.fillStyle = blink ? COLORS.fire1 : "rgba(255,201,90,0.35)";
  ctx.fillText(TOUCH_UI ? "НАЖМИ КНОПКУ СТАРТ" : "ENTER — НАЧАТЬ БОЙ", VW / 2, 202);

  drawDifficultyPicker(248);

  // короткий список — подробности по каждому оружию (тяга турборанца, замах
  // биты, управление жуком в полёте) игрок открывает по ходу дела, не тут;
  // разрастающийся текст в меню — то, от чего уже один раз уходили в редизайне
  const panelW = 580, panelH = 108, panelX = VW / 2 - panelW / 2, panelY = 296;
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  ctx.fillRect(panelX, panelY, panelW, panelH);
  ctx.strokeStyle = "rgba(240,234,216,0.3)";
  ctx.lineWidth = 1;
  ctx.strokeRect(panelX + 0.5, panelY + 0.5, panelW - 1, panelH - 1);
  ctx.font = "13px monospace";
  ctx.fillStyle = COLORS.white;
  const lines = TOUCH_UI ? [
    "СЛЕВА — ДВИЖЕНИЕ И ПРИЦЕЛ      СПРАВА — ПРЫЖОК",
    "ОГОНЬ — ДЕРЖАТЬ, ЧТОБЫ НАБРАТЬ СИЛУ, ОТПУСТИТЬ ДЛЯ ВЫСТРЕЛА",
    "ОРУЖИЕ — КНОПКА СВЕРХУ          ЗВУК " + (state.muted ? "ВЫКЛ" : "ВКЛ"),
  ] : [
    "← → ДВИЖЕНИЕ      ↑ ↓ ПРИЦЕЛ      SHIFT ПРЫЖОК",
    "SPACE — ДЕРЖАТЬ, ЧТОБЫ НАБРАТЬ СИЛУ, ОТПУСТИТЬ ДЛЯ ВЫСТРЕЛА",
    "1-7 — ВЫБОР ОРУЖИЯ          M — ЗВУК " + (state.muted ? "ВЫКЛ" : "ВКЛ"),
  ];
  lines.forEach((line, i) => ctx.fillText(line, VW / 2, panelY + 32 + i * 30));
  ctx.textAlign = "left";
}

function drawGameOver() {
  ctx.fillStyle = "rgba(10,10,20,0.82)";
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = state.playerWon ? COLORS.hpGreen : COLORS.hpRed;
  ctx.font = "bold 44px monospace";
  ctx.fillText(state.playerWon ? "ПОБЕДА!" : "ПОРАЖЕНИЕ", VW / 2, 220);
  ctx.fillStyle = COLORS.white;
  ctx.font = "bold 20px monospace";
  ctx.fillText(TOUCH_UI ? "НАЖМИ КНОПКУ СТАРТ" : "ENTER — ЕЩЁ РАЗ", VW / 2, 280);
  drawDifficultyPicker(315);
  ctx.textAlign = "left";
}

// ===== INPUT =====

const BLOCKED_KEYS = new Set(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "ShiftLeft", "ShiftRight"]);

window.addEventListener("keydown", (e) => {
  ensureAudio();
  if (BLOCKED_KEYS.has(e.code)) e.preventDefault();
  if (e.code === "Enter") handleEnter();
  if (e.code === "Space" && !e.repeat) handleSpaceDown();
  if (!e.repeat) {
    if (e.code === "Digit1") { selectWeapon("bazooka"); selectDifficulty("easy"); }
    if (e.code === "Digit2") { selectWeapon("grenade"); selectDifficulty("veteran"); }
    if (e.code === "Digit3") { selectWeapon("jetpack"); selectDifficulty("armageddon"); }
    if (e.code === "Digit4") selectWeapon("bat");
    if (e.code === "Digit5") selectWeapon("beetle_flying");
    if (e.code === "Digit6") selectWeapon("dynamite");
    if (e.code === "Digit7") selectWeapon("beetle_crawl");
    if (e.code === "ShiftLeft" || e.code === "ShiftRight") handleJump();
    if (e.code === "KeyM") toggleMute();
  }
  keysDown.add(e.code);
});

window.addEventListener("keyup", (e) => {
  if (BLOCKED_KEYS.has(e.code)) e.preventDefault();
  keysDown.delete(e.code);
  if (e.code === "Space") handleSpaceRelease();
});

window.addEventListener("blur", () => keysDown.clear());

// ===== MAIN LOOP =====

function update(dt) {
  if (state.screen === "MENU") { updateExplosionEffects(dt); updateFloaters(dt); updateCamera(dt); updateMusic(dt); return; }
  for (const w of worms) updateWormPhysics(w, dt);
  switch (state.screen) {
    case "INTRO": updateIntroPan(dt); break;
    case "PLAYER_TURN": updatePlayerTurn(dt); break;
    case "PROJECTILE": updateProjectiles(dt); break;
    case "EXPLOSION": updateExplosionState(); break;
    case "AI_TURN": updateAiTurnPause(dt); break;
    case "AI_MOVING": updateAiMoving(dt); break;
    case "AI_CHARGING": updateAiCharging(dt); break;
  }
  updateExplosionEffects(dt);
  updateFloaters(dt);
  updateBanner(dt);
  updateCrates(dt);
  updateMines(dt);
  updateBarrels(dt);
  updateDynamites(dt);
  updateTurnTimer(dt);
  updateWaterAnim(dt);
  handlePlayerRetreatMovement(dt);
  updateCamera(dt);
  updateMusic(dt);
  if (state.screen !== "GAME_OVER") {
    updateMatchTimer(dt);
    updateWaterDamage();
    updateFireZones(dt);
  }
}

function render() {
  drawSky();
  ctx.save();
  ctx.translate(-Math.round(camera.x), 0);
  ctx.drawImage(terrainCanvas, 0, 0);
  if (state.screen !== "MENU") {
    drawMines();
    drawBarrels();
    drawDynamites();
    drawCrates();
    for (const w of worms) if (w.alive) drawWorm(w);
    for (const p of projectiles) drawProjectile(p);
    drawFireZones();
  }
  drawExplosions();
  if (state.screen !== "MENU") drawWater();
  drawFloaters();
  ctx.restore();
  if (state.screen !== "MENU" && state.screen !== "GAME_OVER") drawBanner();
  drawHUD();
  if (state.screen === "MENU") drawMenu();
  if (state.screen === "GAME_OVER") drawGameOver();
}

let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(loop); });
</script>
</body>
</html>
